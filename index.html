<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio With Grid</title>

    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/images/favicon_io/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/images/favicon_io/favicon-32x32.png"
    />

    <link
      rel="icon"
      sizes="16x16"
      href="/assets/images/favicon_io/favicon-16x16.png"
    />

    <link rel="stylesheet" href="./css/bootstrap-icons.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!--! === === navbar === === !-->

    <nav id="nav" class="nav">
      <div class="nav__center">
        <div class="nav__header">
          <h3>webprog.io</h3>
          <button id="nav-btn" class="nav__btn">
            <i class="bi bi-list-nested"></i>
          </button>
        </div>
        <ul class="nav__links">
          <li>
            <a href="javascript:void(0)">صفحه اصلی</a>
          </li>
          <li>
            <a href="javascript:void(0)">درباره ما</a>
          </li>
          <li>
            <a href="javascript:void(0)">پروژه ها</a>
          </li>
          <li>
            <a href="javascript:void(0)">مقالات</a>
          </li>
        </ul>
      </div>
    </nav>

    <!--! === sidebar === !-->

    <aside id="sidebar" class="sidebar">
      <div>
        <button id="close-btn" class="sidebar__close-btn">
          <i class="bi bi-x"></i>
        </button>
        <ul class="sidebar__links">
          <li>
            <a href="javascript:void(0)">صفحه اصلی</a>
          </li>
          <li>
            <a href="javascript:void(0)">درباره ما</a>
          </li>
          <li>
            <a href="javascript:void(0)">پروژه ها</a>
          </li>
          <li>
            <a href="javascript:void(0)">مقالات</a>
          </li>
        </ul>

        <ul class="social-icons">
          <li>
            <a href="#" class="social-icon">
              <i class="bi bi-linkedin"></i>
            </a>
          </li>
          <li>
            <a href="#" class="social-icon">
              <i class="bi bi-telegram"></i>
            </a>
          </li>
          <li>
            <a href="#" class="social-icon">
              <i class="bi bi-whatsapp"></i>
            </a>
          </li>
          <li>
            <a href="#" class="social-icon">
              <i class="bi bi-facebook"></i>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <!--! === === Header === === !-->

    <header class="hero">
      <div class="hero__section-center hero__center">
        <article class="hero__info">
          <div class="underline"></div>
          <h2>لورم ایپسوم</h2>
          <h4>اورم ایپسوم متن ساختگی با تولید سلدگی</h4>
          <a href="#" class="hero__btn btn">لورم ایپسوم</a>

          <ul class="social-icons hero__social-icons">
            <li>
              <a href="#" class="social-icon">
                <i class="bi bi-linkedin"></i>
              </a>
            </li>
            <li>
              <a href="#" class="social-icon">
                <i class="bi bi-telegram"></i>
              </a>
            </li>
            <li>
              <a href="#" class="social-icon">
                <i class="bi bi-whatsapp"></i>
              </a>
            </li>
            <li>
              <a href="#" class="social-icon">
                <i class="bi bi-facebook"></i>
              </a>
            </li>
          </ul>
        </article>
        <article class="hero__image">
          <img src="./assets/images/hero-img.jpg" class="hero__photo" alt="hero-img">
        </article>
      </div>

    <!--*  Link JavaScript File  *-->
    <script src="./js/app.js"></script>
